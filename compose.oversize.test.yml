services:
  redis-oversize:
    image: redis:7.4-alpine
    command: ["redis-server", "--client-query-buffer-limit", "1048576"]
    networks:
      oversize: {}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30

  service-oversize:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--config", "/config/docker-oversize-config.json"]
    working_dir: /state
    volumes:
      - ./tests/docker-oversize-config.json:/config/docker-oversize-config.json:ro
      - oversize-state:/state
    networks:
      oversize: {}
    depends_on:
      redis-oversize:
        condition: service_healthy

  oversize-integration-test:
    image: python:3.13-alpine
    command: ["python", "/tests/docker_oversize_integration.py"]
    environment:
      REDIS_HOST: redis-oversize
      REDIS_PORT: 6379
      STATUS_URL: http://service-oversize:9090/
    volumes:
      - ./tests:/tests:ro
    networks:
      oversize: {}
    depends_on:
      service-oversize:
        condition: service_started
      redis-oversize:
        condition: service_healthy

volumes:
  oversize-state: {}

networks:
  oversize:
    driver: bridge
