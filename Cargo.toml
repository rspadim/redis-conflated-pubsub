[package]
name = "redis-conflated-pubsub"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A Redis Pub/Sub fan-out bridge with per-output conflation"
license = "MIT"
repository = "https://github.com/rspadim/redis-conflated-pubsub"

[[bin]]
name = "redis-conflated-pubsub"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
redis = { version = "1.7.1", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.51", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
