[package]
name = "redis-conflated-pubsub"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A Redis Pub/Sub fan-out bridge with per-output conflation"
license = "MIT"
repository = "https://github.com/rspadim/redis-conflated-pubsub"

[[bin]]
name = "redis-conflated-pubsub"
path = "src/main.rs"

[build-dependencies]
# Windows VERSIONINFO resources (product name/version, copyright). Required by
# SignPath Foundation before the executable can be signed, and shown by Windows
# in the file properties and SmartScreen. Only compiled for Windows targets; see
# build.rs.
winresource = "0.1.34"

[dependencies]
anyhow = "1.0"# Core NATS runtime adapter. Minimal feature set: `websockets` for ws/wss,
# `nkeys` for NKey/JWT credentials, `ring` as the rustls crypto provider.
async-nats = { version = "=0.50.0", default-features = false, features = ["websockets", "nkeys", "ring"] }
# `Bytes` is the payload type the async-nats publish API takes; it is already in
# the dependency tree transitively but must be named to call `Client::publish`.
bytes = "1.11"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
percent-encoding = "2.3"
redis = { version = "1.7.1", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "unicode"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.51", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
# Implements the Windows service protocol (control handler, status reporting), so
# the service the installer registers can be started and stopped by the service
# control manager. See src/service_host.rs; other targets do not compile it.
windows-service = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
