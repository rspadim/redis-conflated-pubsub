services:
  redis-raw:
    image: ${HOTPATH_KV_IMAGE:-valkey/valkey:9.1.2-alpine}
    networks:
      hotpath: {}
    healthcheck:
      test: ["CMD-SHELL", "${HOTPATH_KV_CLI:-valkey-cli} ping | grep -q PONG"]
      interval: 1s
      timeout: 1s
      retries: 30

  redis-output:
    image: ${HOTPATH_KV_IMAGE:-valkey/valkey:9.1.2-alpine}
    networks:
      hotpath: {}
    healthcheck:
      test: ["CMD-SHELL", "${HOTPATH_KV_CLI:-valkey-cli} ping | grep -q PONG"]
      interval: 1s
      timeout: 1s
      retries: 30

  service-hotpath:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--config", "/config/hotpath-config.json"]
    working_dir: /state
    volumes:
      - ${HOTPATH_CONFIG_FILE:-./tests/docker-hotpath-config.json}:/config/hotpath-config.json:ro
      - hotpath-state:/state
    networks:
      hotpath: {}
    depends_on:
      redis-raw:
        condition: service_healthy
      redis-output:
        condition: service_healthy

  hotpath-benchmark:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    command: ["sh", "-c", "exec ${HOTPATH_BENCHMARK_CMD:-hotpath-benchmark}"]
    environment:
      REDIS_HOST: redis-raw
      OUTPUT_REDIS_HOST: redis-output
      STATUS_URL: http://service-hotpath:9090/
      PUBLISHER_COUNT: ${HOTPATH_PUBLISHER_COUNT:-4}
      MESSAGES_PER_PUBLISHER: ${HOTPATH_MESSAGES_PER_PUBLISHER:-2500}
      SERIAL_MESSAGES: ${HOTPATH_SERIAL_MESSAGES:-250}
      HOTPATH_MODE: ${HOTPATH_MODE:-closed-loop}
      HOTPATH_PIPELINE: ${HOTPATH_PIPELINE:-64}
    volumes:
      - ./tests:/tests:ro
    networks:
      hotpath: {}
    depends_on:
      service-hotpath:
        condition: service_started
      redis-raw:
        condition: service_healthy
      redis-output:
        condition: service_healthy

volumes:
  hotpath-state: {}

networks:
  hotpath:
    driver: bridge
