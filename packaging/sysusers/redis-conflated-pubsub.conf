# Service account for redis-conflated-pubsub.service.
#
# systemd-sysusers applies this when the post-install script calls it, and, if
# that never ran (unpacked package, image build), at the next boot. It needs no
# shadow-utils, which minimal RPM images do not ship. The home directory and the
# shell default to "/" and "/usr/sbin/nologin"; the unit's StateDirectory owns
# /var/lib/redis-conflated-pubsub.
u redis-conflated-pubsub - "Redis Conflated Pub/Sub" /var/lib/redis-conflated-pubsub
