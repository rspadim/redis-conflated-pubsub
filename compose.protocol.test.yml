services:
  redis-protocol:
    image: redis:7.4-alpine
    command: ["redis-server", "--client-query-buffer-limit", "1048576"]
    networks:
      protocol: {}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30

  counting-proxy:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    command: ["redis-conflated-e2e", "counting-proxy"]
    environment:
      REDIS_HOST: redis-protocol
      REDIS_PORT: 6379
      PROXY_PORT: 6379
      STATS_PORT: 9091
    networks:
      protocol: {}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6379"]
      interval: 1s
      timeout: 2s
      retries: 30
    depends_on:
      redis-protocol:
        condition: service_healthy

  service-protocol:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--config", "/config/docker-protocol-config.json"]
    working_dir: /state
    volumes:
      - ./tests/docker-protocol-config.json:/config/docker-protocol-config.json:ro
      - protocol-state:/state
    networks:
      protocol: {}
    depends_on:
      counting-proxy:
        condition: service_healthy
      redis-protocol:
        condition: service_healthy

  protocol-integration-test:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    command: ["redis-conflated-e2e", "protocol-integration"]
    environment:
      REDIS_HOST: redis-protocol
      REDIS_PORT: 6379
      STATUS_URL: http://service-protocol:9090/
      PROXY_HOST: counting-proxy
      PROXY_STATS_PORT: 9091
    networks:
      protocol: {}
    depends_on:
      service-protocol:
        condition: service_started
      counting-proxy:
        condition: service_healthy
      redis-protocol:
        condition: service_healthy

volumes:
  protocol-state: {}

networks:
  protocol:
    driver: bridge
