name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require the tag to match Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version = \"\(.*\)\"$/\1/p' Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version"

  build:
    needs: validate-tag
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: linux-x86_64-musl
            binary: redis-conflated-pubsub
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            binary: redis-conflated-pubsub.exe
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            binary: redis-conflated-pubsub
          - runner: macos-26
            target: aarch64-apple-darwin
            artifact: macos-aarch64
            binary: redis-conflated-pubsub
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.binary }}"
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "${{ matrix.artifact }}.zip"
          $hash = (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Set-Content "${{ matrix.artifact }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
