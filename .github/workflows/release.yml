name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require the tag to match Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version = \"\(.*\)\"$/\1/p' Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version"

  build:
    needs: validate-tag
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: linux-x86_64-musl
            binary: redis-conflated-pubsub
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            binary: redis-conflated-pubsub.exe
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            binary: redis-conflated-pubsub
          - runner: macos-26
            target: aarch64-apple-darwin
            artifact: macos-aarch64
            binary: redis-conflated-pubsub
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.binary }}"
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "${{ matrix.artifact }}.zip"
          $hash = (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Set-Content "${{ matrix.artifact }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*
          if-no-files-found: error

  # The executable is signed BEFORE the installer packs it. The installer embeds
  # and compresses the executable, so a signature applied afterwards could never
  # reach the inner file. See SIGNING.md.
  sign-windows-exe:
    name: Sign the Windows executable
    needs: build
    # Skipped until the SignPath certificate exists; see SIGNING.md.
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist
      - name: Unpack the executable
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          unzip -o windows-x86_64.zip
          # The unsigned package and its checksum are replaced at the end of this
          # job, so they must not survive as they are.
          rm -f windows-x86_64.zip windows-x86_64.zip.sha256
          test -f redis-conflated-pubsub.exe
      - name: Upload the unsigned executable
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-unsigned
          path: dist/redis-conflated-pubsub.exe
          if-no-files-found: error
      - name: Submit the signing request
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_EXE }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Repack the signed executable
        shell: bash
        run: |
          set -euo pipefail
          # The service may return the file under a different name, so take
          # whatever .exe came back and restore the released file name.
          signed="$(find signed -name '*.exe' -type f | head -n 1)"
          test -n "$signed"
          cp "$signed" dist/redis-conflated-pubsub.exe
          cd dist
          zip -q -9 windows-x86_64.zip redis-conflated-pubsub.exe
          # Checksums cover the signed bytes: they are recomputed here and never
          # carried over from the unsigned build.
          shasum -a 256 windows-x86_64.zip > windows-x86_64.zip.sha256
          shasum -a 256 redis-conflated-pubsub.exe > windows-x86_64.exe.sha256
      - name: Replace the release artifact with the signed package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/windows-x86_64.zip
            dist/windows-x86_64.zip.sha256
            dist/windows-x86_64.exe.sha256
          overwrite: true
          if-no-files-found: error

  build-installer:
    name: Build the Windows installer
    needs: [build, sign-windows-exe]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the packaged executable
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist
      - name: Stage the executable where the installer expects it
        shell: pwsh
        run: |
          Expand-Archive -Path dist\windows-x86_64.zip -DestinationPath dist -Force
          New-Item -ItemType Directory -Force target\release | Out-Null
          Copy-Item dist\redis-conflated-pubsub.exe target\release\ -Force
          # The installer ships the schema for editor completion; it is generated
          # from the binary instead of being checked in.
          & .\target\release\redis-conflated-pubsub.exe --config-json-schema |
            Set-Content -Encoding utf8 config.schema.json
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Compile the installer
        id: compile
        shell: pwsh
        run: |
          # The fixed version resource accepts digits and dots only, so a
          # pre-release suffix is stripped from the version handed to Inno.
          $version = "${{ github.ref_name }}".TrimStart('v')
          $numeric = ($version -replace '[^0-9.].*$', '').TrimEnd('.')
          if (-not $numeric) { throw "cannot derive a numeric version from '$version'" }
          "numeric=$numeric" >> $env:GITHUB_OUTPUT

          iscc "/DAppVersion=$numeric" "installer\redis-conflated-pubsub.iss"
          $exe = "installer\output\ConflatedPubSubSetup-$numeric.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "installer was not produced: $exe" }
          Write-Host "installer built: $exe"
      - name: Upload the unsigned installer
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: installer/output/*.exe
          if-no-files-found: error
      - name: Submit the signing request
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_INSTALLER }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Checksum the installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\output\*.exe | Select-Object -First 1
          if (-not $exe) { throw "no installer in installer\output" }

          if ("${{ vars.SIGNPATH_ENABLED }}" -eq 'true') {
            # Publish the signed bytes, never the unsigned ones.
            $signed = Get-ChildItem signed -Recurse -Filter *.exe | Select-Object -First 1
            if (-not $signed) { throw "the signing service returned no installer" }
            Copy-Item $signed.FullName $exe.FullName -Force
          }

          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding utf8 "$($exe.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/output/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, sign-windows-exe, build-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
