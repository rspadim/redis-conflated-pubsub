name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  linux-static:
    name: Build static Linux binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build static Linux image
        run: docker build --pull --platform linux/amd64 --tag redis-conflated-pubsub:ci .
      - name: Smoke-test the static Linux image
        run: docker run --rm --platform linux/amd64 redis-conflated-pubsub:ci --version
      - name: Extract the static binary
        run: |
          container_id=$(docker create --platform linux/amd64 redis-conflated-pubsub:ci)
          mkdir -p dist
          docker cp "$container_id:/usr/local/bin/redis-conflated-pubsub" dist/
          docker rm "$container_id"
      - uses: actions/upload-artifact@v7
        with:
          name: redis-conflated-pubsub-linux-x86_64-musl
          path: dist/redis-conflated-pubsub
          if-no-files-found: error

  redis-integration:
    name: Redis Pub/Sub, protocol limits, and channel-policy TTL/conflation E2Es
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Run Redis Pub/Sub, protocol, and channel-policy TTL/conflation E2Es
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose -p redis-conflated-ci -f compose.test.yml --profile fault down --volumes --remove-orphans || true
            docker compose -p redis-conflated-ci-protocol -f compose.protocol.test.yml down --volumes --remove-orphans || true
            docker compose -p redis-conflated-ci-oversize -f compose.oversize.test.yml down --volumes --remove-orphans || true
            docker compose -p redis-conflated-ci-ttl -f compose.ttl.test.yml down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose -p redis-conflated-ci -f compose.test.yml up --build --abort-on-container-exit --exit-code-from integration-test
          docker compose -p redis-conflated-ci -f compose.test.yml down --volumes

          docker compose -p redis-conflated-ci-protocol -f compose.protocol.test.yml up --build --abort-on-container-exit --exit-code-from protocol-integration-test
          docker compose -p redis-conflated-ci-protocol -f compose.protocol.test.yml down --volumes

          docker compose -p redis-conflated-ci-oversize -f compose.oversize.test.yml up --build --abort-on-container-exit --exit-code-from oversize-integration-test
          docker compose -p redis-conflated-ci-oversize -f compose.oversize.test.yml down --volumes

          docker compose -p redis-conflated-ci-ttl -f compose.ttl.test.yml up --build --remove-orphans --abort-on-container-exit --exit-code-from ttl-integration-test
          docker compose -p redis-conflated-ci-ttl -f compose.ttl.test.yml down --volumes --remove-orphans

          docker compose -p redis-conflated-ci -f compose.test.yml --profile fault up --build --abort-on-container-exit --exit-code-from fault-integration fault-integration

      - name: Clean up channel-policy TTL/conflation Compose stack
        if: always()
        run: docker compose -p redis-conflated-ci-ttl -f compose.ttl.test.yml down --volumes --remove-orphans || true

  experiment-harnesses:
    name: Experiment harnesses (spikes)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - name: Lint and build NATS spike
        working-directory: spikes/nats
        run: |
          cargo fmt --manifest-path Cargo.toml -- --check
          cargo clippy --all-targets --locked --manifest-path Cargo.toml -- -D warnings
          cargo build --locked --manifest-path Cargo.toml
      - name: Lint and build transport comparison harness
        working-directory: spikes/compare
        run: |
          cargo fmt --manifest-path Cargo.toml -- --check
          cargo clippy --all-targets --locked --manifest-path Cargo.toml -- -D warnings
          cargo build --locked --manifest-path Cargo.toml

  nats-auth-smoke:
    name: NATS auth matrix smoke (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Run the local NATS auth matrix
        shell: bash
        run: |
          chmod +x spikes/nats/test-auth.sh
          CARGO_TARGET_DIR="$PWD/spikes/nats/.target" spikes/nats/test-auth.sh

  monitoring-validation:
    name: Validate Zabbix monitoring files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s monitoring -p 'test_*.py'
      - run: python -m json.tool monitoring/config.example.json > /dev/null
      - name: Validate Zabbix XML templates
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('monitoring/zabbix_template_5.0.xml'); ET.parse('monitoring/zabbix_template_7.0.xml')"

  linux-compatibility:
    name: Linux compatibility (Ubuntu ${{ matrix.ubuntu }})
    needs: linux-static
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04", "24.04", "26.04"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: redis-conflated-pubsub-linux-x86_64-musl
          path: dist
      - run: chmod +x dist/redis-conflated-pubsub
      - name: Run static binary in Ubuntu container
        run: docker run --rm --platform linux/amd64 -v "$PWD/dist:/dist:ro" ubuntu:${{ matrix.ubuntu }} /dist/redis-conflated-pubsub --version

  # Building the packages here on every run keeps a broken nfpm.yaml, maintainer
  # script or unit file from being found only on a release tag.
  linux-packages:
    name: Build and install the deb/rpm/apk/pkg packages
    needs: linux-static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NFPM_VERSION: "2.48.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: redis-conflated-pubsub-linux-x86_64-musl
          path: dist
      - run: chmod +x dist/redis-conflated-pubsub
      - name: Install nFPM
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" "$base/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"
          (cd "$RUNNER_TEMP" && grep "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz\$" checksums.txt | sha256sum --check)
          sudo tar -xzf "$RUNNER_TEMP/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" -C /usr/local/bin nfpm
          nfpm --version
      - name: Build the packages
        shell: bash
        run: |
          set -euo pipefail
          # Placeholder version, like the installer job: releases take the real
          # version from Cargo.toml.
          export VERSION=0.0.0
          for packager in deb rpm apk archlinux; do
            nfpm package --config nfpm.yaml --packager "$packager" --target dist/
          done
          ls -l dist/
      - name: Install the packages in distribution containers
        shell: bash
        run: |
          set -euo pipefail
          # The same release list the compatibility matrix above uses.
          for release in 20.04 22.04 24.04 26.04; do
            echo "::group::dpkg install on Ubuntu $release"
            docker run --rm --platform linux/amd64 -v "$PWD/dist:/dist:ro" "ubuntu:$release" bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq /dist/redis-conflated-pubsub_*_amd64.deb
              redis-conflated-pubsub --version
              redis-conflated-pubsub --config /etc/redis-conflated-pubsub/config.json --check-config
              id redis-conflated-pubsub
              test -f /usr/lib/systemd/system/redis-conflated-pubsub.service
              test -f /usr/lib/sysusers.d/redis-conflated-pubsub.conf
              dpkg --purge redis-conflated-pubsub
              ! id redis-conflated-pubsub
            '
            echo "::endgroup::"
          done

          echo "::group::rpm install on Fedora"
          docker run --rm --platform linux/amd64 -v "$PWD/dist:/dist:ro" fedora:latest bash -c '
            set -euo pipefail
            rpm -ivh /dist/*.rpm
            redis-conflated-pubsub --version
            redis-conflated-pubsub --config /etc/redis-conflated-pubsub/config.json --check-config
            id redis-conflated-pubsub
            test -f /usr/lib/systemd/system/redis-conflated-pubsub.service
            rpm -e redis-conflated-pubsub
          '
          echo "::endgroup::"

          echo "::group::apk install on Alpine"
          docker run --rm --platform linux/amd64 -v "$PWD/dist:/dist:ro" alpine:3.22 sh -c '
            set -eu
            apk add --allow-untrusted /dist/redis-conflated-pubsub_*_x86_64.apk
            redis-conflated-pubsub --version
            redis-conflated-pubsub --config /etc/redis-conflated-pubsub/config.json --check-config
            id redis-conflated-pubsub
            test -f /etc/init.d/redis-conflated-pubsub
            apk del redis-conflated-pubsub
          '
          echo "::endgroup::"

          echo "::group::pacman install on Arch"
          docker run --rm --platform linux/amd64 -v "$PWD/dist:/dist:ro" archlinux:latest bash -c '
            set -euo pipefail
            pacman -U --noconfirm /dist/*.pkg.tar.zst
            redis-conflated-pubsub --version
            redis-conflated-pubsub --config /etc/redis-conflated-pubsub/config.json --check-config
            id redis-conflated-pubsub
            pacman -R --noconfirm redis-conflated-pubsub
          '
          echo "::endgroup::"

  windows-installer:
    name: Compile the Windows installer (unsigned)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo build --release --locked
      - run: choco install innosetup -y --no-progress
        shell: pwsh
      - name: Compile the installer
        shell: pwsh
        run: |
          # Compiling here on every run keeps a broken .iss from being found only
          # on a release tag. Releases pass the real version; this is a
          # placeholder numeric value.
          iscc "/DAppVersion=0.0.0" "installer\redis-conflated-pubsub.iss"
          $exe = "installer\output\ConflatedPubSubSetup-0.0.0.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "the installer was not produced" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-unsigned
          path: installer/output/*.exe
          if-no-files-found: error
