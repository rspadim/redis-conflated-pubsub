[package]
name = "nats-transport-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1.0"
async-nats = { version = "=0.50.0", features = ["websockets"] }
bytes = "1.11"
futures-util = "0.3"
redis = { version = "1.7.1", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
tokio = { version = "1.51", features = ["macros", "rt-multi-thread", "sync", "time"] }
