services:
  redis:
    image: redis:7.4-alpine
    networks:
      e2e: {}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30

  service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--config", "/config/docker-config.json"]
    working_dir: /state
    volumes:
      - ./tests/docker-config.json:/config/docker-config.json:ro
      - integration-state:/state
    networks:
      e2e: {}
    depends_on:
      redis:
        condition: service_healthy

  random-publisher:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    command: ["redis-conflated-e2e", "random-publisher"]
    environment:
      REDIS_HOST: redis
    networks:
      e2e: {}
    depends_on:
      redis:
        condition: service_healthy

  integration-test:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    command: ["redis-conflated-e2e", "integration"]
    environment:
      REDIS_HOST: redis
      STATUS_URL: http://service:9090/
    networks:
      e2e: {}
    depends_on:
      service:
        condition: service_started
      random-publisher:
        condition: service_started

  fault-proxy:
    profiles: ["fault"]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    command: ["redis-conflated-e2e", "fault-proxy"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PROXY_PORT: 6379
      STATS_PORT: 9091
      FAULT_ON_SUCCESSFUL_EXEC_NUMBER: 2
    networks:
      e2e: {}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6379"]
      interval: 1s
      timeout: 2s
      retries: 30
    depends_on:
      redis:
        condition: service_healthy

  fault-service:
    profiles: ["fault"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--config", "/config/docker-fault-config.json"]
    working_dir: /state
    volumes:
      - ./tests/docker-fault-config.json:/config/docker-fault-config.json:ro
      - fault-state:/state
    networks:
      e2e: {}
    depends_on:
      fault-proxy:
        condition: service_healthy

  fault-integration:
    profiles: ["fault"]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    command: ["redis-conflated-e2e", "fault-integration"]
    environment:
      REDIS_HOST: redis
      PROXY_HOST: fault-proxy
      FAULT_APP_HOST: fault-service
      STATUS_URL: http://fault-service:9090/
    networks:
      e2e: {}
    depends_on:
      fault-service:
        condition: service_started
      fault-proxy:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  integration-state: {}
  fault-state: {}

networks:
  e2e:
    driver: bridge
